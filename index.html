<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Netlify Site</title>
    <style>
        /* A clean, modern style to show your site is live */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .badge {
            display: inline-block;
            background: #00c48c;
            padding: 6px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            color: white;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.7;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .emoji-large {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
        }

        .footer {
            font-size: 0.85rem;
            opacity: 0.7;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
            margin-top: 10px;
        }

        .footer span {
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji-large">🚀</span>
        <div class="badge">Live on Netlify</div>
        <h1>Deployed with GitHub Actions   Mulualem Wordofa </h1>
        <p>
            Every push to the <strong>main</strong> branch automatically triggers
            a GitHub Actions workflow that builds and deploys this site to Netlify.
        </p>
       Yohana Yohana, Winian 
        <div class="footer">
            <span>⬇️</span> Push to GitHub &rarr; Deployed instantly <span>⬆️</span>
            Mulualem Wordofa 
            
        </div>

    
    </div>
</body>
</html>
